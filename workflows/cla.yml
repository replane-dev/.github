name: CLA Assistant
on:
  workflow_call:
    secrets:
      CLA_TOKEN:
        required: true

jobs:
  cla:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' || (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    steps:
      - uses: contributor-assistant/github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_TOKEN }}
        with:
          path-to-signatures: 'signatures.json'
          path-to-document: 'https://github.com/replane/.github/blob/main/CLA.md'
          remote-organization-name: replane
          remote-repository-name: .github
          branch: 'main'
          allowlist: 'bot*,dependabot*,renovate*'

