name: CLA Assistant
on:
  workflow_call:
    secrets:
      CLA_ACCESS_TOKEN:
        required: true

jobs:
  cla:
    runs-on: ubuntu-latest
    # Note: The if condition was removed because when called via workflow_call,
    # github.event_name is 'workflow_call', not the original trigger.
    # The calling workflow handles the proper trigger conditions.
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLA_ACCESS_TOKEN: ${{ secrets.CLA_ACCESS_TOKEN }}
        with:
          path-to-signatures: "signatures.json"
          path-to-document: "https://github.com/replane-dev/.github/blob/main/CLA.md"
          remote-organization-name: replane-dev
          remote-repository-name: .github
          branch: "main"
          allowlist: "bot*,dependabot*,renovate*"
